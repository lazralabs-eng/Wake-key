name: Generate pronunciation audio

# Run by hand from the Actions tab (works from the GitHub app on iPad too),
# or automatically when the pronunciation list changes on main.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate every clip
        type: boolean
        default: false
      only:
        description: Comma-separated ids to regenerate (blank for missing only)
        type: string
        default: ''
  push:
    branches: [main]
    paths: [public/data/pronunciations.json]

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only=${{ inputs.only }}"; fi
          node scripts/gen-audio.mjs $ARGS
      - name: Commit clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then echo "No audio changes."; exit 0; fi
          git commit -m "Generate pronunciation audio"
          git push
